  - sub_path: 'HpPlatformPkg/MultiProject/Z21ManaanPkg/Z21ManaanPkgConfig.dsc'
    label: 'Z21ManaanPkgConfig.dsc'
    option_debug_flag: false
    old_code: |2

      #

      [Defines]
         !include $(HP_PROJECT_PACKAGE)/Config/HpFeature/HpFeatureMiscConfig.dsc
         !include $(HP_PROJECT_PACKAGE)/Config/HpFeature/BootOptionsConfig.dsc
         !include $(HP_PROJECT_PACKAGE)/Config/HpFeature/SystemOptionsConfig.dsc
    new_code: |2

      #

      [Defines]
         #
         # Serial debug output selection. All three sides share the one SIO UART at IO 0x3F8, and
         # they are independent - any combination is valid.
         #
         #   HP_DEBUG_LOG_BIOS  BIOS-side DEBUG() from C code (PEI / DXE / SMM).
         #                      Drives DEBUG_BIOS_ENABLE. Files opt in individually by including
         #                      <Library/HpForceDebugLib.h>; see
         #                      HpPlatformPkg/Library/HpForceDebugLib/README.md.
         #
         #   HP_DEBUG_LOG_ACPI  ACPI-side tracing from AML. Drives PcdSerialDebugInAcpiEnable,
         #                      which BuildOptions.dsc turns into -DSERIAL_DEBUG=1 for the ASL
         #                      compiler. The output comes from Intel's ADBG (~2000 call sites
         #                      already in the DSDT), routed to the UART by SDBG in the local
         #                      copy of PlatformHooks.asl under AcpiTables/Dt/Dsdt/ - see the
         #                      HP_MOD block there. HP's own \_SB.OutDbg() plumbing is also
         #                      compiled in but has no live call sites on this board.
         #
         #   HP_DEBUG_LOG_POST  POST code trace, one line per status code:
         #
         #                          POSTCODE=<1624>
         #
         #                      The single source is HpFeature's DebugPostCode.c
         #
         #                          DEBUG ((DEBUG_EVENT, "POSTCODE=<%04X>\n", (UINT16)Value));
         #
         #                      linked into RtsCallbackHandler Pei/Dxe/Smm, which hang off
         #                      ReportStatusCode. Those three modules contain no other DEBUG() at
         #                      all, and DEBUG_EVENT is used in exactly one more place in the whole
         #                      tree (Intel's PeiSmbusLib, which resolves to DebugLibNull), so
         #                      selecting that one level yields the POST codes and nothing else.
         #
         #                      Two things have to line up, hence two knobs below:
         #                        - HP_FEATURE_ERROR_HANDLING_DEBUG_MSG gives those modules a
         #                          printing DebugLib and -UMDEPKG_NDEBUG. It is declared under
         #                          !ifndef upstream, so defining it here wins.
         #                        - PROJECT_DEBUG_LEVEL must contain DEBUG_EVENT (0x00080000);
         #                          see Config/PlatformPcdConfig.dsc.
         #
         # Defined here rather than in PlatformPkgConfig.dsc because HpFeatureMiscConfig.dsc is
         # included first and has to see them.
         #
         # Telling the three apart in a capture: BIOS output happens during POST and carries
         # whatever tag the opted-in file uses; POST codes are the fixed POSTCODE=<xxxx> form and
         # also run through POST; ACPI output starts at DSDT load and is Intel's bracketed form,
         # e.g. "[DSDT][AcpiTableEntry]".
         #
         # Set all three FALSE for a shipping build.
         #
         DEFINE HP_DEBUG_LOG_BIOS = TRUE
         DEFINE HP_DEBUG_LOG_ACPI = TRUE
         DEFINE HP_DEBUG_LOG_POST = FALSE

         #
         # Opens up RtsCallbackHandler Pei/Dxe/Smm (and the rest of HpFeatureErrorHandling, which
         # costs nothing - PROJECT_DEBUG_LEVEL keeps them quiet). Upstream default lives in
         # HpFeatureErrorHandlingPubIntPkgDebugConfig.dsc:16 behind !ifndef, so this takes
         # precedence rather than colliding.
         #
         # One known side effect: CmosButtonLoadDefaultsPei carries its own module-scope
         # PcdDebugPrintErrorLevel|0x80080046, which overrides PROJECT_DEBUG_LEVEL, so its single
         # EFI_D_ERROR line reappears:
         #
         #        ClearCmosButtonPressedHob->Pressed = 0
         #
         # TceqAlertPei has the same override but contains no DEBUG() at all, so it stays silent.
         #
      !if $(HP_DEBUG_LOG_POST) == TRUE
         DEFINE HP_FEATURE_ERROR_HANDLING_DEBUG_MSG = TRUE
      !endif

         !include $(HP_PROJECT_PACKAGE)/Config/HpFeature/HpFeatureMiscConfig.dsc
         !include $(HP_PROJECT_PACKAGE)/Config/HpFeature/BootOptionsConfig.dsc
         !include $(HP_PROJECT_PACKAGE)/Config/HpFeature/SystemOptionsConfig.dsc
