platform_pcd_modifications:
  - file_name: 'HpFeatureMiscConfig.dsc'
    label: 'HpFeatureMiscConfig.dsc'
    option_debug_flag: false
    old_code: |2-

         gEfiHpFeatureMiscPubIntPkgTokenSpaceGuid.PcdHpPostCodeToSerialPortEnable|FALSE
      !if $(FSP_DEBUG_IN_RELEASE_MODE) == TRUE
         gEfiHpFeatureMiscPubIntPkgTokenSpaceGuid.PcdHpPostCodeToSerialPortEnable|TRUE
      !endif
    new_code: |2-

         gEfiHpFeatureMiscPubIntPkgTokenSpaceGuid.PcdHpPostCodeToSerialPortEnable|FALSE
      !if $(FSP_DEBUG_IN_RELEASE_MODE) == TRUE
         gEfiHpFeatureMiscPubIntPkgTokenSpaceGuid.PcdHpPostCodeToSerialPortEnable|TRUE
      !endif

         #
         # Activate the SIO debug UART in a RELEASE build. Both output paths need it - the ASL side
         # writes IO 0x3F8 directly, so if the LDN was never activated its writes go nowhere just
         # the same as the BIOS side's.
         #
         # SerialPortPlatformHookLib.c gates the Nuvoton SIO UART LDN on
         #
         #     #if DEBUG_MODE || FixedPcdGetBool (PcdHpPostCodeToSerialPortEnable)
         #
         # so either half of that is enough on its own. HP_DEBUG_LOG_BIOS defines DEBUG_MODE=1
         # tree-wide (via DEBUG_BIOS_ENABLE -> BuildOptions.dsc -> *_*_*_CC_FLAGS), which satisfies
         # the first half. This PCD is therefore forced ONLY for the ACPI-only combination, where
         # DEBUG_MODE does not exist and the PCD is the sole thing keeping the UART alive. The !if
         # above keys off FSP_DEBUG_IN_RELEASE_MODE, which envVariables.txt hardcodes to FALSE, so
         # it never fires - hence forcing it here.
         #
         # Deliberately NOT forced when HP_DEBUG_LOG_BIOS is on. Upstream HpFeature DSCs read this
         # PCD as "turn my debug output on", and when it is TRUE they hand their own modules a
         # printing DebugLib, PcdDebugPrintErrorLevel|0x80080046 and -UMDEPKG_NDEBUG. That defeats
         # the per-file opt-in HpForceDebugLib exists to provide - those modules print regardless of
         # PROJECT_DEBUG_LEVEL. The three DSCs that do it:
         #
         #   BuiltInDeviceOptionsPubSrcPkgInf.dsc     BuiltInDeviceOptions Pei/Dxe/Smm
         #   HpFeatureMiscPubSrcPkgInf.dsc            HpFeatureMisc Pei/Dxe/Smm
         #   HpFeatureErrorHandlingPubSrcPkgInf.dsc   TceqAlertPei, CmosButtonLoadDefaultsPei
         #
         # Enabling the UART on its own was measured as harmless on this board: a RELEASE image with
         # the UART active and no traffic boots normally.
         #
         # HP_DEBUG_LOG_POST is in the condition for the same reason as ACPI: it does not define
