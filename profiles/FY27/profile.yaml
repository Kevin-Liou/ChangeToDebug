      #

      [Defines]
        #
        # Global debug volume, once DEBUG_BIOS_ENABLE=TRUE has made DEBUG() live in RELEASE.
        #
        # This is a bitmask ANDed with each DEBUG()'s level, so the value below - 0 - silences
        # every generic DEBUG() in the tree. That is deliberate. HpForceDebugLib has its own
        # HP_FORCE_DEBUG_LEVEL and does not consult this PCD, so the files that opted in still
        # print while everything else stays quiet. Keeping the volume down matters here: this
        # board does not survive a full debug image.
        #
        #   0x00000000  opted-in files only          <- HP_DEBUG_LOG_POST = FALSE
        #   0x00080000  + DEBUG_EVENT                <- HP_DEBUG_LOG_POST = TRUE
        #   0x80000000  + DEBUG_ERROR everywhere     useful as a canary: if the HpFeature
        #                                            ListFeatureSetting lines appear, the build
        #                                            config and the UART are both fine and any
        #                                            missing message is down to that one file
        #   0x80080046  DEBUG_ERROR | DEBUG_EVENT | DEBUG_WARN | DEBUG_LOAD - the original value
        #
        # DEBUG_EVENT (0x00080000) is picked out on its own for HP_DEBUG_LOG_POST because the only
        # DEBUG_EVENT call site in the tree that can reach a printing DebugLib is HpFeature's
        # DebugPostCode.c - "POSTCODE=<%04X>", linked into RtsCallbackHandler Pei/Dxe/Smm. The one
        # other user of that level, Intel's PeiSmbusLib, resolves to DebugLibNull. So raising the
        # volume by this one bit adds the POST code trace and nothing else. See HP_DEBUG_LOG_POST
        # in <Project>PkgConfig.dsc for the other half of the wiring.
        #
      !if $(HP_DEBUG_LOG_POST) == TRUE
        DEFINE PROJECT_DEBUG_LEVEL = 0x00080000
      !else
        DEFINE PROJECT_DEBUG_LEVEL = 0x00000000
      !endif
        DEFINE DBG_SERIAL_PORT_BASE     = 0x3F8
        DEFINE SYSTEM_SIO_BASE_ADDRESS  = 0x260

