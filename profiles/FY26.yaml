# ------------------------------------------------------------
# option_debug_flag 說明
# ------------------------------------------------------------
# 用途：區分「必要修改」與「可選的大量除錯輸出」兩種層級，避免日常開發被過量訊息干擾。
#
# 套用規則（由工具 GUI 的「啟用所有 Debug Flag」控制）：
# - option_debug_flag: false
#     → 視為「必要變更」。不論是否勾選「啟用所有 Debug Flag」，都會套用。
#     → 典型用途：PostCode 走序列埠、提升 ErrorLevel 等基本 Debug 能力。
#
# - option_debug_flag: true
#     → 視為「選配型除錯變更」。只有在勾選「啟用所有 Debug Flag」時才會套用。
#     → 典型用途：一次打開大量子系統的 DEBUG 訊息、ACPI 詳細偵錯、影響範圍大的設定。
#
# 建議使用準則：
# - 設為 false：問題定位必備、風險小、輸出量可控、常駐也不影響效能。
# - 設為 true ：會顯著增加 log 量、可能影響時序或效能、只在深入偵錯/重現低機率問題時使用。
# ------------------------------------------------------------
